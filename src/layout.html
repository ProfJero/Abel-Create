<!doctype html>
<html lang="en" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="robots" content="{{robots}}">
  <link rel="canonical" href="{{canonical}}">
  <meta name="theme-color" content="#f5f4f0">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{site.name}}">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:image" content="{{image}}">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/assets/img/brand/icon-512.png" type="image/png">
  <link rel="apple-touch-icon" href="/assets/img/brand/icon-180.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Inter:wght@400..700&display=swap">
  <link rel="stylesheet" href="/assets/css/app.css">
  <script>document.documentElement.classList.remove('no-js')</script>
  {{schema}}
</head>
<body class="min-h-dvh overflow-x-clip">
  <a href="#main" class="sr-only focus:not-sr-only focus:fixed focus:top-3 focus:left-3 focus:z-[100] focus:rounded-full focus:bg-ink focus:px-4 focus:py-2 focus:text-white">Skip to content</a>
  {{header}}
  <main id="main">
{{content}}
  </main>
  {{footer}}
  {{overlays}}
  <script type="module" src="/assets/js/main.js"></script>
  {{script}}
</body>
</html>

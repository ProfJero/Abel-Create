<!--
title: My account | Abel Create
description: Sign in to re-download the design files you bought.
script: account
noindex: true
-->
<section class="wrap max-w-4xl pt-10 pb-24 sm:pt-16">
  <div data-view="loading" class="grid place-items-center py-24">
    <div class="size-12 animate-spin rounded-full border-4 border-line border-t-accent"></div>
  </div>

  <!-- Signed out -->
  <div data-view="signed-out" hidden class="mx-auto max-w-md">
    <p class="eyebrow">My account</p>
    <h1 class="h-display mt-4 text-5xl">Your downloads, any time.</h1>
    <p class="mt-4 text-ink/70">Sign in with the email you used at checkout to get fresh download links for everything you’ve bought. No password needed.</p>

    <form data-link-form class="mt-8 rounded-[1.5rem] border border-line bg-white p-6" novalidate>
      <div class="field">
        <label for="acc-email" class="label">Email address</label>
        <input id="acc-email" name="email" type="email" required autocomplete="email" placeholder="you@email.com" class="input">
      </div>
      <button class="btn-dark mt-4 w-full py-4">Email me a sign-in link</button>
      <p data-msg class="mt-3 text-sm" role="status"></p>
      <div class="my-5 flex items-center gap-3 text-xs text-mute"><span class="h-px flex-1 bg-line"></span>or<span class="h-px flex-1 bg-line"></span></div>
      <button type="button" data-google class="btn-ghost w-full py-4">
        <svg class="size-5" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.5 12.3c0-.8-.1-1.5-.2-2.3H12v4.3h5.9a5 5 0 0 1-2.2 3.3v2.7h3.6c2.1-1.9 3.2-4.8 3.2-8Z"/><path fill="#34A853" d="M12 23c3 0 5.5-1 7.3-2.7l-3.6-2.7c-1 .7-2.2 1-3.7 1-2.9 0-5.3-1.9-6.2-4.5H2.1v2.8A11 11 0 0 0 12 23Z"/><path fill="#FBBC05" d="M5.8 14.1a6.6 6.6 0 0 1 0-4.2V7.1H2.1a11 11 0 0 0 0 9.8l3.7-2.8Z"/><path fill="#EA4335" d="M12 5.4c1.6 0 3.1.6 4.2 1.7l3.2-3.2A11 11 0 0 0 2.1 7.1l3.7 2.8C6.7 7.3 9.1 5.4 12 5.4Z"/></svg>
        Continue with Google
      </button>
    </form>
  </div>

  <!-- Signed in -->
  <div data-view="signed-in" hidden>
    <div class="flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
      <div>
        <p class="eyebrow">My account</p>
        <h1 class="h-display mt-4 text-5xl">Your downloads</h1>
        <p class="mt-2 text-mute">Signed in as <strong data-user class="text-ink"></strong></p>
      </div>
      <button type="button" data-signout class="btn-ghost btn-sm self-start sm:self-auto">Sign out</button>
    </div>
    <div data-orders class="mt-10 grid gap-6"></div>
  </div>
</section>

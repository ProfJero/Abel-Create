<script type="application/ld+json">

  "@context": "https://schema.org",
  "@type": "Person",
  "name": "{{site.owner}}",
  "alternateName": "{{site.name}}",
  "jobTitle": "{{site.title}}",
  "url": "{{site.url}}",
  "image": "{{site.url}}/assets/img/photos/abel-portrait-960.webp",
  "email": "mailto:{{site.email}}",
